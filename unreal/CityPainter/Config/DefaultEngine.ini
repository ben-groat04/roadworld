; City Painter: photoreal baseline for UE 5.8 (see docs/unreal-photorealism.md).
; Written without the engine installed. Anything marked "VERIFY" is a setting name or value I could not confirm for
; 5.8; an unknown cvar in an ini is silently ignored by the engine, so check each VERIFY line with the console
; (type the name in the editor console; unknown names print "Unknown command") or py\report_environment.py.

[/Script/EngineSettings.GameMapsSettings]
; The sandbox map (created by unreal/tools/py/setup_sandbox_level.py). The legacy look-test level /Game/Maps/RoadTest still
; opens by path (setup_look_test_level.py, screenshot_views.py). The game mode is set on the map and here.
EditorStartupMap=/Game/CityPainter/Maps/L_Sandbox.L_Sandbox
GameDefaultMap=/Game/CityPainter/Maps/L_Sandbox.L_Sandbox
GlobalDefaultGameMode=/Script/CityPainter.CPGameMode
; Large World Coordinates are always on in UE5 (FVector is double precision); there is no switch.

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Default RHI: DirectX 12 (needed for Nanite/Lumen/VSM at full feature level and for hardware ray tracing).
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Shader model 6 is required by Nanite, Lumen and Virtual Shadow Maps.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.RendererSettings]
; --- Global illumination and reflections: Lumen ---
; 0 none, 1 Lumen, 2 screen-space GI (SSGI), 3 plugin. 1 = Lumen.
r.DynamicGlobalIlluminationMethod=1
; 0 none, 1 Lumen, 2 screen-space reflections, 3 plugin. 1 = Lumen.
r.ReflectionMethod=1
; Software ray tracing baseline: Lumen traces mesh distance fields. Hardware RT is OFF by default here...
r.Lumen.HardwareRayTracing=False
; ...but hardware RT support is compiled in (r.RayTracing) so "r.Lumen.HardwareRayTracing 1" works at runtime for the
; look-test A/B on runtime-generated meshes. COST: more shader permutations, longer first compile, extra VRAM/BVH build time.
; Set r.RayTracing=False if shader compile time or memory becomes a problem and HWRT is not being tested.
r.RayTracing=True
; Verified fatal at first rendering start (RenderCore/Private/RenderUtils.cpp:1045): "Ray tracing requires skin cache to be enabled".
r.SkinCache.CompileShaders=True
; Mesh distance fields: required by software Lumen and distance-field shadows/AO. Takes effect after editor restart.
r.GenerateMeshDistanceFields=True
; Runtime-generated meshes get no distance fields (see docs/unreal-photorealism.md s2); this stays on for static kit meshes.
; Dynamic lighting only: no lightmaps needed for a runtime-edited city.
r.AllowStaticLighting=False

; --- Shadows: Virtual Shadow Maps ---
; 0 = cascaded shadow maps, 1 = Virtual Shadow Maps.
r.Shadow.Virtual.Enable=1

; --- Geometry: Nanite ---
; Project-level Nanite support; individual static meshes still opt in.
r.Nanite.ProjectEnabled=True

; --- Virtual textures (needed for Runtime Virtual Texturing: road/terrain blend) ---
; Streaming virtual texture support. Needs shader recompile and an editor restart.
r.VirtualTextures=True
; Allow primitives (meshes, landscape) to write/sample virtual textures. VERIFY: name from 5.x docs ("Virtual Texture Support on primitives").
r.VirtualTexturePrimitives=True

; --- Anti-aliasing / upscaling: TSR ---
; 0 off, 1 FXAA, 2 TAA, 3 MSAA (forward only), 4 TSR.
r.AntiAliasingMethod=4
; Allow the temporal upsampler to render below display resolution (TSR needs this at 1; this is the default).
r.TemporalAA.Upsampling=1

; --- Exposure ---
; Auto exposure on, histogram method (0 = histogram, 1 = basic).
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
; Express exposure min/max as EV100 (the Post Process Volume in RoadTest limits exposure to EV100 8..15 with this on).
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

; --- Sky / atmosphere ---
r.SupportSkyAtmosphere=True
; Let the height fog use the sky atmosphere colour for aerial perspective. VERIFY name.
r.SupportSkyAtmosphereAffectsHeightFog=True

; --- Materials ---
; Substrate stays off for v0 (docs/unreal-photorealism.md: "later"). Flip when testing car paint / wet roads. Needs restart.
r.Substrate=False

[/Script/Engine.Engine]
; Large Worlds / World Partition need nothing here. Open World levels are World Partition; created by the Open World template.

[ConsoleVariables]
; Applied at every start. Keep Lumen Lite out of the baseline (5.8 Beta): enable per test with
;   sg.GlobalIlluminationQuality 1 and sg.ReflectionQuality 1   (Lumen Lite, scalability level 1; VERIFY in 5.8).
; Texture streaming pool; 3060-class cards have 8-12 GB VRAM. Raise if "Texture Streaming Pool Over Budget" appears.
r.Streaming.PoolSize=2000

[DevOptions.Shaders]
; Leave cores free for the editor on 16 GB machines (default is to compile with every idle core).
NumUnusedShaderCompilingThreads=4

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=7CB6932D457EC9A809D02CB7935D1462
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


[CoreRedirects]
; The plugin was split into modules (11 Oct 2026): the old all-in-one road actor moved from module CityPainterSim to CityPainterLegacy.
+ClassRedirects=(OldName="/Script/CityPainterSim.CPRoadMeshActor",NewName="/Script/CityPainterLegacy.CPRoadMeshActor")
+EnumRedirects=(OldName="/Script/CityPainterSim.ECPTestLayout",NewName="/Script/CityPainterLegacy.ECPTestLayout")

[SystemSettings]
; The look uses a fixed exposure near EV100 14 (daylight); the default cached-lighting pre-exposure (4) only covers [-8, 12]
; and made Lumen print a red "going to be clipped" warning over every frame. 8 covers [-4, 16].
r.EyeAdaptation.CachedLightingPreExposure=8
